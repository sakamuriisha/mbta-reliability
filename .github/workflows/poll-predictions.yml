name: Poll predictions

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; GitHub may run it a few minutes late at busy times
  workflow_dispatch:

concurrency:
  group: poll-predictions
  cancel-in-progress: false

jobs:
  poll:
    if: vars.GCP_PROJECT != ''   # skip quietly until BigQuery is set up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: python -m ingest poll --sink bigquery
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}
